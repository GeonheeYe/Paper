<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iTransformer Figure 4 — 실제 Forward Pass 시각화</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg2: #161b26;
      --bg3: #1e2535;
      --panel: #1e2535;
      --border: #2e3a50;
      --ink: #e8edf5;
      --muted: #7a8ba3;
      --blue: #4d9fff;
      --amber: #f5a623;
      --rose: #f26d7d;
      --teal: #2dd4bf;
      --violet: #a78bfa;
      --green: #4ade80;
      --yellow: #facc15;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:auto}

    /* ── HEADER ── */
    .header{
      padding:24px 32px 0;
      border-bottom:1px solid var(--border);
    }
    .header h1{font-size:clamp(18px,2.4vw,28px);font-weight:800;letter-spacing:-.02em}
    .header h1 span{color:var(--teal)}
    .header p{color:var(--muted);font-size:14px;margin-top:6px;padding-bottom:20px}
    .back-link{
      display:inline-flex;align-items:center;gap:6px;
      color:var(--muted);font-size:13px;text-decoration:none;
      margin-bottom:16px;
    }
    .back-link:hover{color:var(--ink)}

    /* ── STEP BAR ── */
    .stepbar{
      display:flex;align-items:center;justify-content:center;
      gap:0;padding:20px 24px;
      border-bottom:1px solid var(--border);
      flex-wrap:wrap;gap:4px;
    }
    .stepbar-item{
      display:flex;flex-direction:column;align-items:center;gap:4px;
      cursor:pointer;padding:4px 10px;border-radius:8px;
      transition:background .2s;
      min-width:68px;
    }
    .stepbar-item:hover{background:var(--bg3)}
    .stepbar-item.active .stepnum{
      background:var(--teal);color:#0f1117;font-weight:700;
    }
    .stepbar-item.done .stepnum{
      background:var(--bg3);color:var(--teal);border-color:var(--teal);
    }
    .stepnum{
      width:28px;height:28px;border-radius:50%;
      border:2px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      font-size:12px;font-weight:600;
      background:var(--bg2);
      transition:all .3s;
    }
    .steplabel{font-size:10px;color:var(--muted);text-align:center;line-height:1.3;max-width:72px}
    .stepbar-item.active .steplabel{color:var(--teal)}

    /* ── MAIN LAYOUT ── */
    .main{
      display:grid;
      grid-template-columns:minmax(0,1fr) 320px;
      gap:0;
      min-height:calc(100vh - 200px);
    }
    @media(max-width:900px){.main{grid-template-columns:1fr}}

    /* ── STAGE ── */
    .stage{
      padding:28px 32px;
      border-right:1px solid var(--border);
      min-width:0;
    }
    .stage-title{
      font-size:22px;font-weight:700;margin-bottom:6px;
      display:flex;align-items:center;gap:10px;
    }
    .stage-title .badge{
      font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;
      background:var(--teal);color:#0f1117;
    }
    .stage-formula{
      font-family:monospace;font-size:13px;
      color:var(--teal);
      background:var(--bg3);
      border:1px solid var(--border);
      border-radius:8px;
      padding:10px 16px;
      margin:12px 0 20px;
      display:inline-block;
    }
    .stage-body{
      min-height:320px;
      overflow-x:auto;
      padding-bottom:4px;
    }
    .step-panel{max-width:100%;overflow-x:visible}
    .stage-insight{
      margin-top:20px;
      border-left:3px solid var(--teal);
      padding:10px 16px;
      background:var(--bg3);
      border-radius:0 8px 8px 0;
      font-size:13.5px;line-height:1.6;
      color:var(--muted);
    }
    .stage-insight strong{color:var(--ink)}

    /* ── SIDEBAR ── */
    .sidebar{
      padding:24px 20px;
      background:var(--bg2);
      overflow-y:auto;
    }
    .sidebar h3{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
    .arch-flow{display:flex;flex-direction:column;gap:0;align-items:stretch}
    .arch-block{
      padding:10px 14px;border-radius:8px;
      border:1.5px solid var(--border);
      font-size:12.5px;font-weight:600;
      text-align:center;
      background:var(--bg3);
      cursor:pointer;
      transition:all .2s;
    }
    .arch-block.active{
      border-color:var(--teal);
      background:rgba(45,212,191,.12);
      color:var(--teal);
    }
    .arch-block sub{font-size:10px;font-weight:400;color:var(--muted);display:block}
    .arch-arrow{
      width:22px;
      min-height:18px;
      margin:0 auto;
      color:var(--muted);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      font-weight:800;
    }
    .arch-arrow.active{color:var(--teal)}
    .sidebar-shapes{margin-top:24px}
    .shape-row{
      display:flex;justify-content:space-between;align-items:center;
      padding:6px 0;border-bottom:1px solid var(--border);
      font-size:12px;
    }
    .shape-row:last-child{border-bottom:none}
    .shape-name{color:var(--muted)}
    .shape-val{
      font-family:monospace;font-size:11px;
      color:var(--teal);
      background:var(--bg3);
      padding:2px 8px;border-radius:4px;
    }

    /* ── CONTROLS ── */
    .controls{
      display:flex;align-items:center;justify-content:center;
      gap:12px;padding:20px;
      border-top:1px solid var(--border);
      background:var(--bg2);
    }
    .btn{
      display:flex;align-items:center;gap:6px;
      padding:10px 20px;border-radius:8px;
      border:1.5px solid var(--border);
      background:var(--bg3);color:var(--ink);
      font-size:14px;font-weight:600;cursor:pointer;
      transition:all .2s;
    }
    .btn:hover{border-color:var(--teal);color:var(--teal)}
    .btn.primary{background:var(--teal);color:#0f1117;border-color:var(--teal)}
    .btn.primary:hover{background:#1fb8a4}
    .btn:disabled{opacity:.3;cursor:not-allowed}
    .step-counter{
      font-size:13px;color:var(--muted);min-width:70px;text-align:center;
    }

    /* ── MATRIX GRID ── */
    .mat{
      display:inline-grid;
      gap:2px;
      font-family:monospace;font-size:12px;
      max-width:100%;
    }
    .mat-cell{
      display:flex;align-items:center;justify-content:center;
      min-width:38px;height:28px;
      border-radius:5px;
      background:var(--bg3);
      border:1px solid var(--border);
      transition:all .4s;
      padding:0 3px;
      font-size:9.5px;
      line-height:1;
      white-space:nowrap;
    }
    .mat-cell.hi{border-color:currentColor;box-shadow:0 0 8px currentColor;}
    .mat-label{
      font-size:11px;color:var(--muted);
      text-align:center;margin-top:6px;
      font-style:italic;
    }
    .mat-title{
      font-size:11.5px;font-weight:700;color:var(--muted);
      margin-bottom:6px;letter-spacing:.04em;
    }

    /* ── HEAT ── */
    .heatmap{
      display:inline-grid;
      gap:3px;
    }
    .heat-cell{
      display:flex;align-items:center;justify-content:center;
      width:72px;height:52px;
      border-radius:6px;
      font-weight:700;font-size:13px;
      transition:all .4s;
    }
    .heat-axis{
      display:flex;align-items:center;justify-content:center;
      width:72px;height:52px;
      font-size:11px;color:var(--muted);font-weight:600;
    }

    /* ── TOKEN ROW ── */
    .token-row{
      display:flex;align-items:center;gap:8px;
      margin:8px 0;
      flex-wrap:wrap;
    }
    .token-label{
      font-size:12px;font-weight:700;min-width:56px;
      padding:4px 10px;border-radius:6px;
      border:1.5px solid currentColor;
      text-align:center;
    }
    .token-vals{
      display:flex;gap:4px;flex-wrap:wrap;
    }
    .token-val{
      min-width:42px;height:32px;
      display:flex;align-items:center;justify-content:center;
      border-radius:5px;
      background:var(--bg3);
      border:1px solid var(--border);
      font-family:monospace;font-size:11.5px;
      transition:background .4s, border-color .4s;
    }

    /* ── COMPARE PANEL ── */
    .compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:700px){.compare{grid-template-columns:1fr}}

    /* ── ATTENTION WRAP ── */
    .attn-wrap{
      display:flex;gap:32px;align-items:flex-start;
      flex-wrap:wrap;
      max-width:100%;
      overflow-x:auto;
      padding-bottom:4px;
    }

    /* ── FFN VIZ ── */
    .ffn-wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;max-width:100%;overflow-x:auto;padding-bottom:4px}
    .ffn-layer{
      display:flex;flex-direction:column;gap:4px;
      align-items:center;
    }
    .ffn-node{
      width:36px;height:36px;border-radius:50%;
      border:2px solid var(--border);
      background:var(--bg3);
      display:flex;align-items:center;justify-content:center;
      font-size:10px;font-family:monospace;
      transition:all .4s;
    }
    .ffn-node.active{border-color:var(--teal);box-shadow:0 0 8px var(--teal)}
    .ffn-arrow{
      font-size:20px;color:var(--muted);
      align-self:center;
    }
    .ffn-title{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}

    /* ── STEP ANIM ── */
    .step-panel{
      animation: none;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    /* ── PIPELINE ── */
    .pipeline{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:0;
      max-width:480px;
    }
    .pipe-block{
      width:100%;
      padding:8px 14px;
      border-radius:8px;
      border:1.5px solid var(--border);
      background:var(--bg3);
      text-align:center;
    }
    .pipe-block.active{
      border-color:var(--teal);
      background:rgba(45,212,191,.1);
    }
    .pipe-block .pipe-name{font-size:13px;font-weight:700}
    .pipe-block .pipe-shape{font-size:11px;color:var(--muted);font-family:monospace;margin-top:3px}
    .pipe-block .pipe-desc{font-size:10.5px;color:var(--muted);margin-top:2px}
    .pipe-arrow{
      display:flex;flex-direction:column;align-items:center;
      padding:0;color:var(--muted);font-size:14px;
      line-height:1.2;
    }

    /* ── WEIGHT MINI ── */
    .weight-box{
      background:var(--bg3);
      border:1px solid var(--border);
      border-radius:8px;
      padding:10px 14px;
      font-size:11px;font-family:monospace;
      color:var(--muted);
    }
    .weight-box strong{color:var(--ink);font-size:12px;display:block;margin-bottom:6px}

    /* ── residual box ── */
    .res-box{
      display:flex;align-items:center;gap:12px;
      flex-wrap:wrap;
      max-width:100%;
      overflow-x:auto;
      padding-bottom:4px;
    }
    .res-plus{font-size:24px;color:var(--muted);font-weight:300}

    .tag{
      display:inline-block;
      padding:2px 8px;border-radius:4px;
      font-size:11px;font-weight:700;
      margin-right:4px;
    }
    @media(max-width:700px){
      .header{padding:18px 18px 0}
      .stage{padding:20px 16px}
      .stage-title{font-size:18px;align-items:flex-start;flex-wrap:wrap}
      .stage-formula{font-size:11px;max-width:100%;overflow-x:auto}
      .mat-cell{min-width:36px;height:28px;font-size:9.5px}
      .heat-cell,.heat-axis{width:58px;height:44px;font-size:10.5px}
      .controls{gap:8px;padding:14px;flex-wrap:wrap}
      .btn{padding:8px 12px;font-size:12px}
    }
  </style>
</head>
<body>

<div class="header">
  <a class="back-link" href="/">← 개요 페이지로</a>
  <h1>iTransformer <span>Figure 4</span> — 실제 Forward Pass 단계별 시각화</h1>
  <p>기온·습도·CO₂ 3개 변수의 과거 6시점을 보고, 각 변수의 미래 4시점(t₇~t₁₀)을 예측하는 forecasting task입니다. (d_model=10, heads=5, d_head=2, d_ff=8)</p>
</div>

<div class="stepbar" id="stepbar"></div>

<div class="main">
  <div class="stage">
    <div id="stage-content"></div>
  </div>
  <div class="sidebar">
    <h3>Encoder 구조</h3>
    <div class="arch-flow" id="arch-flow"></div>
    <div class="sidebar-shapes" id="sidebar-shapes"></div>
  </div>
</div>

<div class="controls">
  <button class="btn" id="btn-prev">◀ 이전</button>
  <button class="btn primary" id="btn-play">▶ 자동재생</button>
  <span class="step-counter" id="step-counter"></span>
  <button class="btn" id="btn-next">다음 ▶</button>
</div>

<script>
// ════════════════════════════════════════════
//  DATA & MATH
// ════════════════════════════════════════════
const VARS = [
  {name:'기온', unit:'°C', color:'var(--blue)',  raw:[18,19,21,24,25,23]},
  {name:'습도', unit:'%',  color:'var(--amber)', raw:[62,64,61,58,57,60]},
  {name:'CO₂',  unit:'×10',color:'var(--rose)',  raw:[41,43,48,57,64,61]}
];
const T=6, N=3, D_MODEL=10, N_HEADS=5, D_HEAD=2, D_FF=8;

function mean(a){return a.reduce((s,x)=>s+x,0)/a.length}
function std(a){const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length)}
function layernorm(a){const m=mean(a),s=std(a)+1e-8;return a.map(x=>(x-m)/s)}
function softmax(a){const mx=Math.max(...a),e=a.map(x=>Math.exp(x-mx)),s=e.reduce((t,v)=>t+v,0);return e.map(x=>x/s)}
function gelu(x){return 0.5*x*(1+Math.tanh(Math.sqrt(2/Math.PI)*(x+0.044715*x**3)))}
function fmt(v,d=2){return v.toFixed(d)}
function fmtArr(a,d=2){return a.map(x=>fmt(x,d))}
const seed=(i,j,c)=>((i*7+j*3+c)%11-5)*0.14;

// Normalize inputs
const X_NORM = VARS.map(v=>{const m=mean(v.raw),s=std(v.raw);return v.raw.map(x=>(x-m)/s)});

// Embedding weights W_E (D_MODEL × T)
const W_E=Array.from({length:D_MODEL},(_,d)=>Array.from({length:T},(_,t)=>seed(d,t,0)));

// H = X_NORM @ W_E^T  (N × D_MODEL)
const H = X_NORM.map(x=>W_E.map(w=>x.reduce((s,v,k)=>s+v*w[k],0)));

// QKV projection weights per head: each head maps d_model → d_head.
const W_Q=Array.from({length:N_HEADS},(_,h)=>Array.from({length:D_MODEL},(_,i)=>Array.from({length:D_HEAD},(_,j)=>seed(i,j,h+4))));
const W_K=Array.from({length:N_HEADS},(_,h)=>Array.from({length:D_MODEL},(_,i)=>Array.from({length:D_HEAD},(_,j)=>seed(i,j,h+9))));
const W_V=Array.from({length:N_HEADS},(_,h)=>Array.from({length:D_MODEL},(_,i)=>Array.from({length:D_HEAD},(_,j)=>seed(i,j,h+14))));

function project(mat, weights){
  return mat.map(row=>weights[0].map((_,j)=>row.reduce((s,x,k)=>s+x*weights[k][j],0)));
}

const HEADS=Array.from({length:N_HEADS},(_,h)=>{
  const Q=project(H,W_Q[h]);
  const K=project(H,W_K[h]);
  const V=project(H,W_V[h]);
  const scores=Q.map(q=>K.map(k=>q.reduce((s,x,i)=>s+x*k[i],0)/Math.sqrt(D_HEAD)));
  const A=scores.map(row=>softmax(row));
  const out=A.map(row=>V[0].map((_,j)=>row.reduce((s,a,i)=>s+a*V[i][j],0)));
  return {Q,K,V,scores,A,out};
});

const Q_mat=HEADS[0].Q;
const K_mat=HEADS[0].K;
const V_mat=HEADS[0].V;
const QKT=HEADS[0].scores;
const A_soft=HEADS[0].A;

// Multi-head attention output = concat(head_1 ... head_5), shape (N × d_model)
const attn_out=Array.from({length:N},(_,i)=>HEADS.flatMap(head=>head.out[i]));

// Residual + LN
const U_attn=H.map((h,i)=>h.map((x,j)=>x+attn_out[i][j]));
const H_attn=U_attn.map(row=>layernorm(row));
const LN_EXAMPLE_ROW=0;
const LN_EXAMPLE_U=U_attn[LN_EXAMPLE_ROW];
const LN_EXAMPLE_MEAN=mean(LN_EXAMPLE_U);
const LN_EXAMPLE_STD=std(LN_EXAMPLE_U)+1e-8;

// FFN weights  (fixed seed)
const W1=Array.from({length:D_FF},(_,i)=>Array.from({length:D_MODEL},(_,j)=>seed(i,j,1)));
const W2=Array.from({length:D_MODEL},(_,i)=>Array.from({length:D_FF},(_,j)=>seed(j,i,2)));

const FFN_out=H_attn.map(h=>{
  const h1=W1.map(w=>gelu(h.reduce((s,x,k)=>s+x*w[k],0)));
  return W2.map(w=>h1.reduce((s,x,k)=>s+x*w[k],0));
});

// Final residual + LN
const H_next=H_attn.map((h,i)=>layernorm(h.map((x,j)=>x+FFN_out[i][j])));

// Forecast projection weights (D_MODEL → H_FUTURE=4)
const H_FUTURE=4;
const W_PROJ=Array.from({length:H_FUTURE},(_,i)=>Array.from({length:D_MODEL},(_,j)=>seed(i,j,3)));
const FORECAST=H_next.map(h=>W_PROJ.map(w=>h.reduce((s,x,k)=>s+x*w[k],0)));
const W_PROJ_T=Array.from({length:D_MODEL},(_,d)=>Array.from({length:H_FUTURE},(_,h)=>W_PROJ[h][d]));
const DENORM_FORECAST=FORECAST.map((row,i)=>{
  const m=mean(VARS[i].raw), s=std(VARS[i].raw);
  return row.map(v=>v*s+m);
});

// ════════════════════════════════════════════
//  HELPERS: HTML builders
// ════════════════════════════════════════════
function colorForVar(i){return ['var(--blue)','var(--amber)','var(--rose)'][i]}
function nameForVar(i){return ['기온','습도','CO₂'][i]}
function actualForecastValue(i,v){
  if(nameForVar(i)==='CO₂') return `${fmt(v*10,2)} ppm`;
  return `${fmt(v,2)}${VARS[i].unit}`;
}

function matGrid(rows,cols,cellFn,opts={}){
  const {gridCols=cols,label='',title=''}=opts;
  let s='<div>';
  if(title) s+=`<div class="mat-title">${title}</div>`;
  s+=`<div class="mat" style="grid-template-columns:repeat(${gridCols},1fr)">`;
  rows.forEach((row,ri)=>(Array.isArray(row)?row:[row]).forEach((v,ci)=>{
    s+=cellFn(v,ri,ci);
  }));
  s+='</div>';
  if(label) s+=`<div class="mat-label">${label}</div>`;
  s+='</div>';
  return s;
}

function cell(val,color='',extra=''){
  const style=color?`color:${color};border-color:${color}40`:'';
  return `<div class="mat-cell" style="${style}">${typeof val==='number'?fmt(val):val}</div>`;
}

function tokenRows(data,extra=''){
  return data.map((row,i)=>`
    <div class="token-row">
      <div class="token-label" style="color:${colorForVar(i)}">${nameForVar(i)}</div>
      <div class="token-vals">${row.map(v=>`<div class="token-val" style="border-color:${colorForVar(i)}30">${typeof v==='number'?fmt(v,2):v}</div>`).join('')}</div>
      ${extra}
    </div>`).join('');
}

function heatCell(v,i,j){
  const alpha=Math.max(0.08,v);
  const c=`rgba(45,212,191,${alpha})`;
  const tc=v>0.4?'#0f1117':'var(--ink)';
  return `<div class="heat-cell" style="background:${c};color:${tc}">${fmt(v,2)}</div>`;
}

function heatmap3x3(matrix,rowLabels,colLabels){
  let s=`<div>`;
  s+=`<div style="display:inline-grid;grid-template-columns:60px repeat(${colLabels.length},72px);gap:3px">`;
  s+=`<div class="heat-axis"></div>`;
  colLabels.forEach(l=>{s+=`<div class="heat-axis" style="font-size:11px;color:var(--muted)">${l}</div>`});
  matrix.forEach((row,ri)=>{
    s+=`<div class="heat-axis" style="font-size:11px;color:${colorForVar(ri)}">${rowLabels[ri]}</div>`;
    row.forEach((v,ci)=>{s+=heatCell(v,ri,ci)});
  });
  s+='</div></div>';
  return s;
}

function scoremap3x3(matrix,rowLabels,colLabels){
  let s=`<div>`;
  s+=`<div style="display:inline-grid;grid-template-columns:60px repeat(${colLabels.length},72px);gap:3px">`;
  s+=`<div class="heat-axis"></div>`;
  colLabels.forEach(l=>{s+=`<div class="heat-axis" style="font-size:11px;color:var(--muted)">${l}</div>`});
  matrix.forEach((row,ri)=>{
    s+=`<div class="heat-axis" style="font-size:11px;color:${colorForVar(ri)}">${rowLabels[ri]}</div>`;
    row.forEach(v=>{
      s+=`<div class="heat-cell" style="background:var(--bg3);color:var(--ink);font-size:11px">${fmt(v,2)}</div>`;
    });

  s+='</div></div>';
  return s;
}

function arch(activeBlock){
  const blocks=[
    {id:'input',  name:'Input',        shape:`(${N} × ${T})`,  desc:'원본 데이터'},
    {id:'embed',  name:'Embedding',    shape:`(${N} × ${D_MODEL})`,desc:'MLP: T→d'},
    {id:'mha',    name:'Multi-Head\nSelf-Attention',shape:`(${N} × ${D_MODEL})`,desc:'변수간 상관'},
    {id:'add1',   name:'Add & Norm',   shape:`(${N} × ${D_MODEL})`,desc:'잔차 연결'},
    {id:'ffn',    name:'Feed Forward', shape:`(${N} × ${D_MODEL})`,desc:'변수별 패턴'},
    {id:'add2',   name:'Add & Norm',   shape:`(${N} × ${D_MODEL})`,desc:'잔차 연결'},
    {id:'proj',   name:'Projection',   shape:`(${N} × ${H_FUTURE})`, desc:'미래 예측'},
  ];
  const visualBlocks=[...blocks].reverse();
  let s='<div class="arch-flow">';
  visualBlocks.forEach((b,i)=>{
    s+=`<div class="arch-block${b.id===activeBlock?' active':''}" onclick="goToBlockStep('${b.id}')">
      <div class="pipe-name">${b.name}</div>
      <div class="pipe-shape">${b.shape}</div>
    </div>`;
    if(i<visualBlocks.length-1) s+=`<div class="arch-arrow${b.id===activeBlock?' active':''}">↑</div>`;
  });
  s+='</div>';
  return s;
}

function shapePanel(shapes){
  return '<div class="sidebar-shapes"><h3 style="margin-top:20px">텐서 형태</h3>'+
    shapes.map(([n,v])=>`<div class="shape-row"><span class="shape-name">${n}</span><span class="shape-val">${v}</span></div>`).join('')+'</div>';
}

// ════════════════════════════════════════════
//  RENDER ENGINE
// ════════════════════════════════════════════
let currentStep=0;
let playTimer=null;

const ARCH_MAP={
  input:[0,1,2],embed:[3],mha:[4,5],add1:[6],ffn:[7],add2:[8],proj:[8]
};

function goToBlockStep(blockId){
  const matches=ARCH_MAP[blockId];
  if(matches) goTo(matches[0]);
}

function render(){
  const step=STEPS[currentStep];

  // Stage content
  document.getElementById('stage-content').innerHTML=step.render();

  // Step bar
  const sb=document.getElementById('stepbar');
  sb.innerHTML=STEPS.map((s,i)=>`
    <div class="stepbar-item ${i===currentStep?'active':i<currentStep?'done':''}" onclick="goTo(${i})">
      <div class="stepnum">${i===0?'▶':i}</div>
      <div class="steplabel">${s.label.replace(/\n/,'<br>')}</div>
    </div>
  `).join('');

  // Arch sidebar
  document.getElementById('arch-flow').innerHTML=arch(step.archBlock);

  // Shapes sidebar
  document.getElementById('sidebar-shapes').innerHTML=shapePanel(step.shapes||[]);

  // Counter
  document.getElementById('step-counter').textContent=`${currentStep+1} / ${STEPS.length}`;

  // Buttons
  document.getElementById('btn-prev').disabled=currentStep===0;
  document.getElementById('btn-next').disabled=currentStep===STEPS.length-1;
}

function goTo(i){
  currentStep=Math.max(0,Math.min(STEPS.length-1,i));
  render();
}

document.getElementById('btn-prev').addEventListener('click',()=>goTo(currentStep-1));
document.getElementById('btn-next').addEventListener('click',()=>goTo(currentStep+1));
document.getElementById('btn-play').addEventListener('click',()=>{
  if(playTimer){clearInterval(playTimer);playTimer=null;document.getElementById('btn-play').textContent='▶ 자동재생';return;}
  document.getElementById('btn-play').textContent='⏸ 정지';
  playTimer=setInterval(()=>{
    if(currentStep>=STEPS.length-1){clearInterval(playTimer);playTimer=null;document.getElementById('btn-play').textContent='▶ 자동재생';return;}
    goTo(currentStep+1);
  },3000);
});

// keyboard nav
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') goTo(currentStep+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') goTo(currentStep-1);
});

render();
</script>
</body>
</html>
